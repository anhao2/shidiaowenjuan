function radio(key,title,opts,required=true){return `<fieldset class="q" style="border-left:0;border-right:0;border-top:0;padding-left:0;padding-right:0"><legend class="q-title">${title}${required?'':' <span class="hint">选填</span>'}</legend><div class="options">${opts.map((t,i)=>`<label class="opt"><input type="radio" name="${key}" value="${i}" ${S.answers[key]===i?'checked':''}><span>${t}</span></label>`).join('')}</div></fieldset>`}
function rating(key,title,max=7){const zero=max===10,min=zero?0:1;return `<fieldset class="q" style="border-left:0;border-right:0;border-top:0;padding-left:0;padding-right:0"><legend class="q-title">${title}</legend><div class="rating ${zero?'ten':''}">${Array.from({length:max-min+1},(_,j)=>{const i=min+j;return `<label class="rate"><input type="radio" name="${key}" value="${i}" aria-label="${zero?i+'分':i+' '+lk[i-1]}" ${S.answers[key]===i?'checked':''}><span>${i}</span></label>`}).join('')}</div><div class="rating-label"><span>${zero?'0 完全不想选这家店':'1 完全不同意'}</span><span>${zero?'10 非常想选这家店':'7 完全同意'}</span></div></fieldset>`}
function group(items){return `<p class="scale-key">1 完全不同意 · 2 不同意 · 3 比较不同意 · 4 一般<br>5 比较同意 · 6 同意 · 7 完全同意</p>${items.map(([k,t])=>rating(k,t)).join('')}`}

document.addEventListener('visibilitychange',()=>{if(document.hidden){if(visibleSince!==null)visibleMs+=performance.now()-visibleSince;visibleSince=null}else visibleSince=performance.now()});
function go(n){endPage();S.step=n;persist();render();window.scrollTo({top:0,behavior:'instant'})}
function bind(){document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',()=>{S.answers[x.name]=Number(x.value);persist();$('#error')?.replaceChildren()}));$('#consent')?.addEventListener('change',e=>{S.answers.consent=e.target.checked;persist()});$('#guess')?.addEventListener('input',e=>{S.answers.guess=e.target.value;persist()});$('#decision_text')?.addEventListener('input',e=>{S.answers.decision_text=e.target.value;persist()});document.querySelectorAll('input[name=decision_factors]').forEach(x=>x.addEventListener('change',()=>{const vals=[...document.querySelectorAll('input[name=decision_factors]:checked')].map(e=>Number(e.value));if(vals.length>3){x.checked=false;$('#error').textContent='最多选择3项即可。';return}S.answers.decision_factors=vals;persist();$('#error').textContent=''}));document.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{S.answers.save=Number(b.dataset.save);S.events.push({type:'shortlist',value:S.answers.save,at:new Date().toISOString()});persist();render(false)}));$('#next')?.addEventListener('click',next);$('#quit')?.addEventListener('click',()=>$('#dialog').showModal());$('#export')?.addEventListener('click',()=>download(JSON.stringify(S,null,2),'阅读答卷-'+S.id.slice(0,8)+'.json'));$('#withdraw')?.addEventListener('click',()=>$('#dialog').showModal());$('#follow-note')?.addEventListener('click',()=>download('阅读体验回访\n编号：'+S.id+'\n建议回访时间：'+new Date(S.followupDue).toLocaleString('zh-CN')+'\n请使用本次同一设备、同一浏览器重新打开原网页，点击回访入口。\n本试填版不发送提醒，也不跨设备同步。','回访提示.txt','text/plain;charset=utf-8'));$('#return')?.addEventListener('click',()=>{location.hash='followup'});}
function render(resetTimer=true){if(location.hash==='#research')return researcher();if(location.hash==='#followup')return followup();if(S.status==='screened_out')return out();if(S.status==='withdrawn')return withdrawn();const pct=Math.round(Math.min(S.step,LAST)/LAST*100);$('#app').innerHTML=`<div class="shell"><header class="mast"><span class="brand">周末去哪吃 <small style="font-weight:400;letter-spacing:0">${S.step+1}/${SCREENS.length}</small></span><button class="quit" id="quit">退出阅读</button></header><div class="progress" role="progressbar" aria-label="阅读进度" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><main class="fade">${SCREENS[S.step]()}</main><p class="error" id="error" role="alert"></p></div>${S.step<LAST?`<footer class="bottom"><div><button class="primary" id="next">${S.step===0?'进入周末的选店现场':S.step===5||S.step===7?'读完了，继续':S.step===LAST-1?'完成并保存':'继续'}</button><p class="step-caption">没有标准答案，按你此刻的真实想法回答</p></div></footer>`:''}`;bind();if(resetTimer){visibleMs=0;visibleSince=document.hidden?null:performance.now()} }
function next(){const missing=REQ[S.step].filter(k=>S.answers[k]===undefined||S.answers[k]===null||S.answers[k]===false);if(missing.length){$('#error').textContent=S.step===0?'请先阅读说明并确认自愿参加。':'还有问题没有选择，请按真实想法回答后继续。';const el=document.querySelector(`[name="${missing[0]}"]`);el?.closest('.q')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(S.step===1&&(S.answers.adult===1||S.answers.student===2)){endPage();S.status='screened_out';S.reason='eligibility';commit();render();return}if(S.step===6){S.scores.gain=S.answers.mid-S.answers.baseline;S.gatePassed=S.scores.gain>=CFG.minGain;if(!S.group){S.group=(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296)<.5?'anti':'neutral';S.randomizedAt=new Date().toISOString();persist()}}if(S.step===LAST-1){endPage();S.scores.drop=S.answers.mid-S.answers.post;S.scores.finalDrop=S.answers.mid-S.answers.final;S.scores.reflectionChange=S.answers.post-S.answers.final;S.scores.authorTrust=(S.answers.author1_sincere+S.answers.author1_trust+S.answers.author1_reliable)/3;S.scores.commercialSuspicion=(S.answers.motive1_ad+S.answers.motive1_benefit+S.answers.motive1_relationship+S.answers.motive1_paid)/4;S.analysisPopulation=S.gatePassed?'primary_seeded':'supplementary_not_seeded';S.status='completed';S.completedAt=new Date().toISOString();S.followupDue=new Date(Date.now()+CFG.followupHours*3600000).toISOString();S.step=LAST;commit();render();window.scrollTo(0,0);return}go(S.step+1)}
function explanation(){return `<h3>关于这次阅读</h3><p>我们想了解：先读到推荐内容、产生到店意愿的人，再看到同一家店的负面评价后，想法会怎样变化。</p><p>参与者会随机看到负面体验帖或中性记录帖。两种内容之外，流程相同。我们会比较两组的意愿变化。</p><p>店名、作者、帖子、评论、互动数字和图片均为研究情境材料，不代表真实商家、真实用户或真实到店经历。图片为AI生成。页面没有实际优惠券、预约或商家合作。</p><p>“加入备选”只记录本次模拟阅读中的一次点击，不代表现实到店。</p>`}
function done(){const pending=S.answers.followup===0&&!S.followupCompletedAt;return `<div class="done-icon">✓</div><p class="eyebrow">本次阅读已完成</p><h2>谢谢，周末的选择<br>就先到这里。</h2><p>你的本次答案已${persistence?'保存在当前浏览器':'保留在当前页面，请导出保存'}，没有自动上传到研究组。</p>${pending?`<div class="save-card"><h3>约两天后，再问问你</h3><p>建议回访时间：<br><b>${new Date(S.followupDue).toLocaleString('zh-CN')}</b></p><p class="hint">请保留本网页，并用同一浏览器返回。全部阅读结束后，会向你完整说明研究目的。</p><div class="actions"><button class="secondary" id="follow-note">保存回访提示</button><button class="secondary" id="return">进入回访页</button></div></div>`:`<hr class="rule">${explanation()}`}<div class="actions"><button class="secondary" id="export">导出我的答卷</button><button class="quit" id="withdraw">撤回并删除本次答卷</button></div><p class="hint">问卷编号：${S.id.slice(0,8)} · 仅保存在本机，研究组需另行收集导出文件。</p>`}
function out(){const msg=S.reason==='eligibility'?'本次研究面向年满18周岁的在校大学生，本次阅读到这里结束。':'本次为你安排的阅读环节已完成，感谢你的时间。';$('#app').innerHTML=`<div class="shell"><header class="mast"><span class="brand">周末去哪吃</span></header><div class="done-icon">✓</div><h2>感谢参与</h2><p>${msg}</p><hr class="rule">${explanation()}<div class="actions"><button class="secondary" id="export">导出我的答卷</button><button class="quit" id="withdraw">删除本次答卷</button></div></div>`;bind()}
function withdrawn(){$('#app').innerHTML=`<div class="shell"><header class="mast"><span class="brand">周末去哪吃</span></header><h2>本次答卷已从本机删除</h2><p>此前如曾导出文件，请另行删除该副本。本页没有上传或保留云端记录。</p><hr class="rule">${explanation()}</div>`}
$('#cancel-exit').onclick=()=>$('#dialog').close();$('#confirm-exit').onclick=()=>{const id=S.id;write(RECORDS,records().filter(x=>x.id!==id));try{localStorage.removeItem(KEY)}catch(e){}S={...fresh(),id,status:'withdrawn'};$('#dialog').close();location.hash='';withdrawn()};
function followup(){if(S.status!=='completed'||S.answers.followup!==0){$('#app').innerHTML='<div class="shell"><h2>没有找到待回访答卷</h2><p>请用第一次填写时的设备和浏览器打开原网页。</p><a href="#">返回阅读</a></div>';return}const early=Date.now()<Date.parse(S.followupDue),done=!!S.followupCompletedAt;if(done){location.hash='';return}$('#app').innerHTML=`<div class="shell"><header class="mast"><span class="brand">两天后的想法</span><button class="quit" id="quit">退出</button></header><h2>${early?'还没到回访时间':'又见面了'}</h2>${early?`<p>建议在 ${new Date(S.followupDue).toLocaleString('zh-CN')} 后回来。</p><p>本次阅读的答案已保存在原浏览器中。</p><a href="#">返回完成页</a>`:`<p>还记得上次的小馆吗？只按你现在的想法回答，不用回忆自己之前打了几分。</p><div class="shop"><div class="shop-logo">栖</div><div><h3>栖禾小馆</h3><p>米饭套餐 · 人均约38元</p><p>学校南门附近 · 步行约15分钟</p></div></div>${rating('follow_will',WILL,10)}${radio('follow_exposure','上次阅读后，你是否另外搜索、讨论或接触过这家店的相关信息？',['没有','有','不确定'])}<button class="primary" id="finish-follow">完成回访</button><p class="error" id="error" role="alert"></p>`}</div>`;bind();$('#finish-follow')?.addEventListener('click',()=>{if(S.answers.follow_will===undefined||S.answers.follow_exposure===undefined){$('#error').textContent='请先回答这两道问题。';return}S.followupCompletedAt=new Date().toISOString();commit();location.hash='';render()})}
function researcher(){const rs=records();$('#app').innerHTML=`<div class="shell research"><header class="mast"><span class="brand">研究者说明 · 详细版 V4</span></header><h2>完整填写，按预定标准分析</h2><div class="notice">本版扩展了真实性、作者可信度、商业动机、第二篇动机、到店顾虑和最终意愿。仍是浏览器本地保存，不会集中收卷。</div><div class="pill-links"><a href="#">回到问卷</a><a href="#preview-plant">第一篇</a><a href="#preview-anti">负面帖</a><a href="#preview-neutral">中性帖</a></div><h3>流程与数据口径</h3><ul><li>共22屏。核心意愿在店铺信息后、第一篇后、第二篇后、全部评价后各测一次。前三次原题不变，第四次为补充测量。</li><li>先测第二篇后的即时意愿，再问心理评价，最后再问意愿、备选点击及决定原因。主要总效果使用中测减即时后测，不用最后一次替换主要结果。</li><li>成年在校参与者均继续完整作答，中测涨分不足1分不再提前终止。后台先记录 gatePassed，再随机分配。主分析事先限定 gatePassed=true 的已种草群体；未达到标准者单独补充分析，不与主样本混算。</li><li>第一篇作者可信度3题、内容真实性4题、商业动机怀疑4题；第二篇可信程度3题、动机判断3题；到店顾虑3题；最终意愿1道0—10题加2道1—7题。</li><li>真实性4题含一条理想化表述，不能与正向项直接平均。第二篇动机3项分别代表不同目的，不相加。最终两个1—7题不与0—10分主指标混算。</li><li>作者可信度及商业怀疑的均分仅为预试候选指标。题项为改写或自编，尚未完成中文语境的测量检验；不能仅凭 Bootstrap 结果宣称因果机制成立。</li><li>既有 V1、V2 和 V3 答卷不迁移到 V4，避免不同题序和题项混合。旧版数据仍留在原存储键中，不会被删除。V4缩短主帖，两组第二篇各附6条短评论。实验比较的是“主帖加评论”的组合效果，不能归因为主帖单独作用；需重新预试负面程度、评论真实感和中性程度。</li><li>熟悉同名店、猜中目的、态度识别不符合预期、记不住价格只保留标记，不自动剔除。</li><li>两组第二篇作者、照片、点赞、收藏、发布时间、4段主帖、6条评论及评论昵称和版式相同，后台按50%概率一次分配；不是跨设备均衡配额。</li><li>约48小时回访仅支持原设备原浏览器，不发送提醒；选择不回访的人当场看完整说明。</li></ul><h3>题项逐条核对</h3>${[['第一篇作者可信度',AUTHOR1],['第一篇内容真实性',REAL1],['第一篇商业动机怀疑',MOTIVE1],['第二篇可信程度',REAL2],['第二篇发帖目的',MOTIVE2],['到店顾虑',RISK],['最后的补充意愿',FINAL_EXTRA]].map(([t,items])=>`<details><summary>${t}</summary><ol>${items.map(([k,q])=>`<li>${q}<br><code>${k}</code></li>`).join('')}</ol></details>`).join('')}<h3>正式研究前</h3><p>先让少量同学试填，检查题意、重复感、耗时和材料效果；与指导老师确认题序、量表与分析口径，再冻结版本。若已有预注册，记录本次题序、完整填写及新增变量的修改。此版不提供自动统计显著性结论。</p><h3>理论与测量参考</h3><p><a href="https://www.tandfonline.com/doi/abs/10.1080/00913367.1990.10673191" target="_blank" rel="noopener">Ohanian 1990 信源可信度测量</a>；<a href="https://doi.org/10.1086/209380" target="_blank" rel="noopener">Friestad 与 Wright 1994 说服知识模型</a>。仅作概念依据，不表示本网页逐字使用了原量表。</p><hr class="rule"><h3>本浏览器详细版记录 ${rs.length} 条</h3><div class="actions"><button class="secondary" id="export-all">导出全部 JSON</button><button class="secondary" id="export-csv">导出全部 CSV</button><button class="secondary" id="restart">开始新的试填</button></div>${rs.map(r=>`<div class="record">${esc(r.id.slice(0,8))} · ${esc(r.status)} · ${esc(r.group||'未分组')} · 已种草标记 ${String(r.gatePassed??'—')} · 即时后测 ${r.answers.post??'—'} / 最后意愿 ${r.answers.final??'—'}</div>`).join('')}</div>`;$('#export-all').onclick=()=>download(JSON.stringify(records(),null,2),'详细版问卷_本机记录.json');$('#export-csv').onclick=exportCsv;$('#restart').onclick=()=>{S=fresh();persist();location.hash='';render()};}
function exportCsv(){const rs=records();const base=['id','version','questionnaireMode','status','reason','material','group','gatePassed','analysisPopulation','startedAt','randomizedAt','completedAt','followupDue','followupCompletedAt'];const answerKeys=[...new Set(rs.flatMap(r=>Object.keys(r.answers||{})))];const scoreKeys=[...new Set(rs.flatMap(r=>Object.keys(r.scores||{})))];const headers=[...base,...answerKeys.map(k=>'answer_'+k),...scoreKeys.map(k=>'score_'+k),'post1_visible_ms','post2_visible_ms','timings_json'];const quote=x=>{const v=Array.isArray(x)?JSON.stringify(x):String(x??'');return '"'+v.replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"'};const rows=rs.map(r=>[...base.map(k=>r[k]),...answerKeys.map(k=>r.answers[k]),...scoreKeys.map(k=>r.scores[k]),r.timings[5],r.timings[7],JSON.stringify(r.timings)].map(quote).join(','));download('\ufeff'+[headers.map(quote).join(','),...rows].join('\r\n'),'详细版问卷_本机记录.csv','text/csv;charset=utf-8')}
function preview(){const type=location.hash.slice(9);if(!POSTS[type])return render();$('#app').innerHTML=`<div class="shell"><header class="mast"><span class="brand">材料预览 · 研究者</span><a href="#research">返回说明</a></header>${post(POSTS[type])}</div>`}
window.addEventListener('hashchange',()=>{location.hash.startsWith('#preview-')?preview():render();window.scrollTo(0,0)});
window.addEventListener('pagehide',()=>{if(S.status==='in_progress'){endPage();persist()}});
if(location.hash.startsWith('#preview-'))preview();else render();
</script></body></html>
